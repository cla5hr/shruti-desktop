[project]
name = "shruti-api"
version = "0.1.0"
description = "Shruti FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "shruti-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shruti_api"]
