[project]
name = "shruti-worker"
version = "0.1.0"
description = "Shruti pipeline worker: claims jobs from the queue and runs them"
requires-python = ">=3.12"
dependencies = [
    "shruti-core",
    "faster-whisper>=1.1",
    # speaker separation: pyannote-3.0 + WeSpeaker CAM++ in ONNX form (no torch)
    "sherpa-onnx>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shruti_worker"]
