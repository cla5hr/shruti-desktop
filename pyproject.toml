[project]
name = "shruti-workspace"
version = "0.0.0"
description = "Shruti monorepo workspace root (not an installable package)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
shruti-core = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["shruti_core", "shruti_api", "shruti_worker"]

[tool.pytest.ini_options]
testpaths = ["packages/core", "apps/api/tests", "apps/worker/tests"]
addopts = "-m 'not slow' -q"
markers = [
    "slow: runs real models or long e2e flows (deselect by default)",
]
